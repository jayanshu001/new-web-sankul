# Redis Configuration File (local Docker dev)
#
# Production: use a managed Redis instance with AUTH + private networking.
# Do not expose Redis to the public internet. Host publish is localhost-only
# via docker-compose (`127.0.0.1:6380:6379`).

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Security — enable in staging/prod-like dev; set REDIS_PASSWORD in app .env
# requirepass Web@Sankul301Staging

# Network — inside the container; host access is restricted by compose port bind
bind 0.0.0.0
protected-mode no

# Persistence
appendonly yes
